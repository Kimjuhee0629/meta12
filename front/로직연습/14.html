<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let temp = 5; // 현재기온
      if (temp >= 28) {
        // 28도 이상
        console.log("덥습니다. 반팔 입으세요");
      } else if (temp < 10) {
        // 10도 미만
        console.log("춥습니다. 패딩 입으세요");
      } else {
        console.log("선선합니다. 긴팔 입으세요");
      }
    </script>
  </body>
</html>
