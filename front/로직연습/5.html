<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let isDarkMode = true; // 현재 상태: 켜짐
      if (isDarkMode == true) {
        isDarkMode = false; // 끔
        console.log("라이트 모드로 전환되었습니다.");
      } else {
        isDarkMode = true; // 켬
        console.log("다크 모드로 전환되었습니다.");
      }
    </script>
  </body>
</html>
