    <script>
      let age = 70;
      // 조건: 어린아이(8세 미만) 또는 노인(65세 이상)
      if (age < 8 || age >= 65) {
        console.log("할인 대상입니다! 50% 할인됩니다.");

        console.log("일반 요금입니다.");
      }
    </script>
