  <body>
    <script>
      let password = "pass"; // 사용자입력값
      // length속성은 문자열의 길이를 반환합니다
      if (password.length < 8) {
        console.log("비밀번호는 최소 8자 이상이어야 합니다.");
      } else {
        console.log("안전한 비밀번호입니다. 저장합니다.");
      }
    </script>
  </body>
