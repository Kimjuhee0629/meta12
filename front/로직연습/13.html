<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let age = 15;

      // 조건: 13보다 크거나 같고, '동시에' 19보다 작거나 같아야 함
      if (age >= 13 && age <= 19) {
        console.log("청소년입니다.");
      } else {
        console.log("청소년이 아닙니다.");
      }
    </script>
  </body>
</html>
