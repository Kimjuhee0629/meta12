<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let day = "일요일";

      // ||는 '또는(OR)'을 의미합니다. 둘 중 하나만 참이어도 실행됩니다.
      if (day === "토요일" || day === "일요일") {
        console.log("야호! 주말입니다.");
      } else {
        console.log("평일입니다. 출근/등교 준비하세요.");
      }
    </script>
  </body>
</html>
