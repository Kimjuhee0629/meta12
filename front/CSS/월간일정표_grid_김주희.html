    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    .content {
        display: grid;
        /* 7개의 컬럼(열)을 동일한 비율(1fr)로 생성 */
        grid-template-columns: repeat(7, 1fr);
        max-width: 700px;
        border-top: 1px solid #000;
        border-left: 1px solid #000;
    }
    .calendar {
        border-right: 1px solid #000;
        border-bottom: 1px solid #000;
        padding: 2px;
        font-size: 14px;
        display: flex;
        flex-direction: column;
    }
    .calendar:nth-child(7n + 9) {
    background-color: #fffc36;
    }
    .calendar:nth-child(7n + 15) {
        background-color: #fffd72;
    }
    .merge-7 {
        grid-column: span 7;
        background-color: rgb(6, 0, 90);
        color: white;
        font-weight: bold;
        font-size: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
    }
    .week {
        background-color: rgb(211, 222, 255);
        color: rgb(0, 0, 0);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 5px;
    }
    .name {
        margin-bottom: 5px;
        display: flex;
        justify-content: center;
        align-self: center;
    }
    .event {
        margin-bottom: 5px;
        display: flex;
        justify-content: center;
        align-self: center;
        padding-top: 10px;
        height: 70px;
        text-align: center;
    }
    </style>
</head>
