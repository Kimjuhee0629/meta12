<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>중첩 Flexbox 레이아웃</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        font-family: Arial, sans-serif;
      }

      /* 전체 */
      .page {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* 헤더 */
      .header {
        background-color: rgb(29, 40, 49);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
      }

      .logo {
        background-color: rgb(57, 65, 71);
        color: white;
        padding: 10px 20px;
      }

      .util {
        background-color: rgb(157, 167, 175);
        color: white;
        padding: 10px 20px;
      }

      /* 메인 */
      .main {
        display: flex;
        flex: 1;
      }

      /* 사이드바 */
      .sidebar {
        background-color: #dddddd;
        width: 220px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 20px;
      }

      .profile {
        background-color: #2596ff;
        padding: 20px;
        color: #ffffff;
      }

      .menu {
        background-color: #097ce9;
        padding: 20px;
        height: 100%;
        color: #ffffff;
      }

      /* 콘텐츠 */
      .content {
        background-color: #ffffff;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 20px;
      }

      /* 배너 */
      .banner {
        background-color: #ffc72c;
        padding: 20px;
        width: 100%;
      }

      /* 카드 영역 */
      .cards {
        display: flex;
        gap: 20px;
      }

      .card {
        background-color: #f1f2f6;
        flex: 1;
        display: flex;
        flex-direction: column;
        }

      .card-header {
        background-color: #148d38;
        color: white;
        padding: 10px;
      }

      .card-body {
        background-color: #ffffff;
        flex: 1;
        padding: 20px;
      }

      /* 위젯 */
      .widgets {
        display: flex;
        gap: 20px;
      }

      .widget {
        background-color: #9a4cc7;
        flex: 1;
        padding: 20px;
        color: white;
      }

      /* 푸터 */
      .footer {
        background-color: #1e272e;        
        display: flex;
        height: 40px;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <!-- 헤더 -->
      <header class="header">
        <div class="logo">로고</div>
        <div class="util">유틸 메뉴</div>
      </header>

      <!-- 메인 -->
      <div class="main">
        <!-- 사이드바 -->
        <aside class="sidebar">
          <div class="profile">프로필 박스</div>
          <div class="menu">메뉴 리스트</div>
        </aside>

        <!-- 콘텐츠 -->
        <section class="content">
          <div class="banner">상단 배너</div>

          <!-- 카드 영역 -->
          <div class="cards">
            <div class="card">
              <div class="card-header">카드 헤더</div>
              <div class="card-body">카드 본문</div>
            </div>

            <div class="card">
              <div class="card-header">카드 헤더</div>
              <div class="card-body">카드 본문</div>
            </div>

            <div class="card">
              <div class="card-header">카드 헤더</div>
              <div class="card-body">카드 본문</div>
            </div>
          </div>

          <!-- 위젯 영역 -->
          <div class="widgets">
            <div class="widget">위젯 A</div>
            <div class="widget">위젯 B</div>
          </div>
        </section>
      </div>

      <!-- 푸터 -->
      <footer class="footer">푸터</footer>
    </div>
  </body>
</html>
