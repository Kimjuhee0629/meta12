<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Flexbox 대시보드 레이아웃</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        font-family: Arial, sans-serif;
      }

      /* 전체 대시보드 */
      .dashboard {
        display: flex;
        height: 100vh;
      }

      /* 왼쪽 네비게이션 */
      .nav {
        background-color: midnightblue;
        display: inline-block;
        position: static;
        width: 200px;
        height: 100vh;
      }

      /* 오른쪽 전체 영역 */
      .right {
        background-color: lightskyblue;
        display: inline-block;
        position: relative;
        width: calc(100% - 200px);
        height: 100vh;
      }

      /* 상단바 */
      .topbar {
        background-color: steelblue;
        display: inline-block;
        position: sticky;
        width: 100%;
        height: 60px;
      }

      /* 콘텐츠 영역 */
      .content {
        display: inline-block;
        position: relative;
        width: 100%;
        height: calc(100vh - 120px);
      }

      /* 메인 콘텐츠 */
      .main-content {
        background-color: white;
        display: inline-block;
        float: left;
        width: 70%;
        height: 100%;
        padding: 10px;
     }

      /* 서브 패널 */
      .side-panel {
        background-color: lightsalmon;
        display: inline-block;
        float: right;
        width: 30%;
        height: 100%;
        padding: 10px;

      }

      /* 하단 정보바 */
      .status {
        background-color: steelblue;
        display: inline-block;
        position: sticky;
        width: 100%;
        height: 60px;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <aside class="nav">왼쪽 네비게이션</aside>

      <div class="right">
        <header class="topbar">상단바 (검색 / 사용자 정보)</header>

        <main class="content">
          <section class="main-content">메인 콘텐츠 (차트 / 목록)</section>

          <aside class="side-panel">서브 패널 (알림 / 요약)</aside>
        </main>

        <footer class="status">하단 정보바</footer>
      </div>
    </div>
  </body>
</html>
