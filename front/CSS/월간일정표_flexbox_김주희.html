        .content {

        .merge-7 {

        display: flex;
        justify-content: center;
        align-items: center;
        height: 60px;
        border-right: 1px solid #000;
        border-bottom: 1px solid #000;
        }
        .week {
        background-color: rgb(211, 222, 255);
        color: rgb(0, 0, 0);
        display: flex;
        justify-content: center;
        align-items: center;
        width: calc(100% / 7);
        height: 40px;
        border-right: 1px solid #000;
        border-bottom: 1px solid #000;
        }
        .all {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: calc(100% / 7);
        height: 100px;
        border-right: 1px solid #000;
        border-bottom: 1px solid #000;
        }
        .calendar.all:nth-child(7n + 9) {
            background-color: #fffc36;
        }
        .calendar.all:nth-child(7n + 15) {

        }   
        .name {

        }
        .event {

        justify-content: center;
        align-items: center;
        height: 70px;

    </style>
</head>
