<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experience</title>
    <style>
      :root {
        --bg: #f4f4f4;
        --text: #1e1e1e;
        --muted: #7b7b7b;
        --line: rgba(0, 0, 0, 0.2);
        --card: #d8d8d8;
        --hover: #ff9aa4; /* hover 오버레이 컬러 */
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          "Noto Sans KR",
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* 상단 메뉴(예시) */
      header {
        padding: 22px 0;
        position: sticky;
        top: 0;
        background: rgba(244, 244, 244, 0.9);
        backdrop-filter: blur(8px);
        z-index: 5;
      }
      nav {
        display: flex;
        justify-content: center;
        gap: 46px;
        font-size: 14px;
        color: #9a9a9a;
      }
      nav a {
        color: inherit;
        text-decoration: none;
      }
      nav a.active {
        color: var(--text);
      }

      /* ====== Global container ====== */
      .wrap {
        width: min(1100px, calc(100% - 56px));
        margin: 0 auto;
      }

      /* ====== Top Nav ====== */
      header.topnav {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(244, 244, 244, 0.9);
        backdrop-filter: blur(6px);
        padding: 18px 0;
      }
      .topnav nav {
        display: flex;
        justify-content: center;
        gap: 44px;
        font-size: 20px;
        letter-spacing: 0.2px;
      }
      .topnav a {
        color: #9a9a9a;
      }
      .topnav a.active {
        color: var(--text);
      }
      .topnav a:hover {
        color: #5a5a5a;
      }
      /* Gallery dropdown wrapper */
      /* nav 정렬 안정 */
      .topnav nav {
        align-items: center;
      }

      /* Gallery dropdown wrapper */
      .nav-item {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      /* 드롭다운 */
      .dropdown {
        position: absolute;
        left: 50%;
        top: calc(100% + 10px);
        transform: translateX(-50%) translateY(-6px);
        min-width: 132px;

        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.14);
        border-radius: 8px;
        padding: 10px;

        /* ✅ 애니메이션용 */
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 160ms ease,
          transform 160ms ease,
          visibility 0ms linear 160ms; /* 닫힐 때만 딜레이 */
        z-index: 60;
      }

      /* 드롭다운 항목 */
      .dropdown a {
        display: block;
        padding: 7px 10px;
        font-size: 13px;
        color: #6a6a6a;
        border-radius: 8px;
        white-space: nowrap;
      }
      .dropdown a:hover,
      .dropdown a:focus-visible {
        background: rgba(0, 0, 0, 0.06);
        color: #222;
        outline: none;
      }

      /* ✅ hover / 키보드 포커스 들어오면 열림 */
      .nav-item:hover .dropdown,
      .nav-item:focus-within .dropdown {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
        transition:
          opacity 160ms ease,
          transform 160ms ease,
          visibility 0ms;
      }

      /* ✅ 마우스 살짝 벗어나도 "바로 꺼짐" 방지용 핫존(틈 메우기) */
      .nav-item::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        height: 12px; /* dropdown까지 다리 역할 */
      }

      /* hover/focus로 열리게 */
      .nav-item:hover .dropdown,
      .nav-item:focus-within .dropdown {
        display: block;
      }

      /* 카드 그리드 */
      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
        align-items: stretch;
        padding-top: 100px;
      }

      .card {
        position: relative;
        height: 700px; /* 이미지처럼 세로로 길게 */
        background: var(--card);
        cursor: pointer;
        overflow: hidden;
        border-radius: 4px;
        outline: none;
      }

      /* 카드 이미지(선택) */
      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: grayscale(20%);
        transform: scale(1.02);
        transition:
          transform 0.4s ease,
          filter 0.4s ease;
      }

      /* hover 오버레이 */
      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--hover);
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      /* hover 텍스트 */
      .card .label {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.2px;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        z-index: 2;
        text-shadow: 0 6px 14px rgba(0, 0, 0, 0.28);
        padding: 20px;
        white-space: pre-line;
      }

      .card:hover::after {
        opacity: 0.95;
      }
      .card:hover .label {
        opacity: 1;
        transform: translateY(0);
      }
      .card:hover img {
        transform: scale(1.06);
        filter: grayscale(0%);
      }

      /* 접근성: 키보드 포커스 */
      .card:focus-visible {
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.18);
      }

      /* ====== Modal ====== */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        place-items: center;
        z-index: 50;
        padding: 28px;
      }
      .modal-backdrop.open {
        display: grid;
      }

      .modal {
        width: min(1100px, 96vw);
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }

      .modal-head {
        padding: 22px 26px 14px;
      }

      .modal-toprow {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-start;
      }

      .modal-title-wrap small {
        display: inline-block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }
      .modal-title-wrap h2 {
        font-size: 44px;
        line-height: 1;
        letter-spacing: -0.6px;
      }
      .modal-title-wrap .tagline {
        margin-left: 8px;
        font-size: 12px;
        color: var(--muted);
        vertical-align: middle;
      }

      .modal-meta {
        display: grid;
        gap: 10px;
        justify-items: end;
        color: var(--text);
        font-size: 13px;
      }
      .modal-meta .meta-row {
        display: flex;
        gap: 10px;
        align-items: center;
        color: var(--muted);
      }
      .modal-meta .pill {
        width: 16px;
        height: 16px;
        background: #bbb;
        display: inline-block;
      }

      .modal-close {
        border: 0;
        background: transparent;
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        margin-left: 10px;
        color: #111;
      }

      .modal-divider {
        height: 1px;
        background: var(--line);
        margin-top: 14px;
      }

      .modal-body {
        padding: 18px 26px 26px;
      }

      /* 슬라이더 영역 */
      .viewer {
        position: relative;
        height: min(520px, 60vh);
        background: #d8d8d8;
        border-radius: 4px;
        overflow: hidden;
      }

      .viewer img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* 작업물은 contain이 깔끔한 편 */
        background: #d8d8d8;
        display: block;
      }

      .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 52px;
        height: 52px;
        border: 0;
        background: transparent;
        cursor: pointer;
        opacity: 0.9;
      }
      .arrow.left {
        left: 10px;
      }
      .arrow.right {
        right: 10px;
      }

      .arrow::before {
        content: "";
        display: block;
        width: 18px;
        height: 18px;
        border-left: 3px solid #fff;
        border-bottom: 3px solid #fff;
        transform: rotate(45deg);
        margin: 0 auto;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
      }
      .arrow.right::before {
        transform: rotate(-135deg);
      }

      /* 모바일 대응 */
      @media (max-width: 980px) {
        .wrap {
          width: calc(100% - 32px);
        }
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
        .card {
          height: 380px;
        }
        .modal-title-wrap h2 {
          font-size: 34px;
        }
      }
      @media (max-width: 560px) {
        nav {
          gap: 22px;
        }
        .cards {
          grid-template-columns: 1fr;
        }
      }
      /* ===== Experience load float-in ===== */
      .cards .card {
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 900ms ease,
          transform 900ms ease;
        will-change: opacity, transform;
      }

      .cards .card.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>

  <body>
    <!-- NAV -->
    <header class="topnav">
      <div class="wrap">
        <nav aria-label="Primary">
          <a href="Start.html"
            ><svg
              viewBox="0 0 1195 1195"
              width="20px"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M1109.333 997.248c0 50.176-41.6 90.752-93.12 90.752H724.95V736.32c0-53.056-38.016-96.128-85.056-96.128h-85.12c-46.976 0-85.12 43.072-85.12 96.128V1088H178.39c-51.392 0-93.056-40.576-93.056-90.752V518.272c0-23.36 9.344-44.48 24.192-60.544l-.96-1.856L534.485 82.88c34.304-25.152 89.984-25.152 124.288 0l427.264 372.992-.448 2.368c14.592 16.064 23.744 36.928 23.744 60.032v478.976z"
              />
            </svg>
          </a>
          <a href="./main.html">Main</a>
          <a class="active" href="./Experience.html">Experience</a>
          <!-- ✅ Gallery hover dropdown -->
          <div class="nav-item">
            <a href="./gallery.html" aria-haspopup="true">Gallery</a>
            <div class="dropdown" role="menu" aria-label="Gallery categories">
  <a href="./gallery.html?cat=Game" role="menuitem">Game</a>
  <a href="./gallery.html?cat=Illust" role="menuitem">Illust</a>
  <a href="./gallery.html?cat=3D" role="menuitem">3D</a>
  <a href="./gallery.html?cat=Design" role="menuitem">Design</a>
</div>
          </div>
          <a href="./contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <section class="cards" aria-label="experience cards">
        <!-- ✅ 카드마다 data-*로 모달에 넣을 정보 저장 -->
        <button
          class="card"
          type="button"
          data-kind="Game"
          data-title="ABC Project"
          data-period="2025 - 2026 • Live Service"
          data-role="Role: Art Director"
          data-link1="mmmm::/mmmmmmmm"
          data-link2="mmmm::/mmmmmmmm"
          data-images="./images/work1-1.png"
          style="--hover: #ff9aa4"
        >
          <img src="./images/work1-thumb.png" alt="ABC Project thumbnail" />
          <div class="label">Game<br />-<br />Afterschool Brawl Club</div>
        </button>

        <button
          class="card"
          type="button"
          data-kind="Webtoon"
          data-title="24시회빙환상담소"
          data-period="2023 - 2025 • KaKaoPage"
          data-role="Role: Main Artist"
          data-link1="link::/example"
          data-link2="link::/example2"
          data-images="./images/work2-1.png"
          style="--hover: #9dbbff"
        >
          <img src="./images/work2-thumb.png" alt="DEF Project thumbnail" />
          <div class="label">Webtoon<br />-<br />24시회빙환상담소</div>
        </button>

        <button
          class="card"
          type="button"
          data-kind="Webtoon"
          data-title="입실론"
          data-period="2023 • RidiBooks"
          data-role="Role: Coloring"
          data-link1="sns::/example"
          data-link2="portfolio::/example"
          data-images="./images/work3-1.png"
          style="--hover: #ffcf7a"
        >
          <img src="./images/work3-thumb.png" alt="GHI Series thumbnail" />
          <div class="label">Webtoon<br />-<br />입실론</div>
        </button>

        <button
          class="card"
          type="button"
          data-kind="Personal"
          data-title="Webtoon"
          data-period="2026 • Personal"
          data-role="Role: Practice"
          data-link1="github::/example"
          data-link2="site::/example"
          data-images="./images/work4-1.png"
          style="--hover: #9de0c1"
        >
          <img src="./images/work4-thumb.png" alt="JK Study thumbnail" />
          <div class="label">Webtoon<br />-<br />Comming Soon...</div>
        </button>
      </section>
    </main>

    <!-- ===== Modal ===== -->
    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-label="Project details"
      >
        <div class="modal-head">
          <div class="modal-toprow">
            <div class="modal-title-wrap">
              <small id="mKind">Game</small>
              <h2>
                <span id="mTitle">ABC Project</span>
                <span class="tagline" id="mPeriod"
                  >2025 - 2026 • Live Service</span
                >
              </h2>
            </div>

            <div style="display: flex; gap: 14px; align-items: flex-start">
              <div class="modal-meta">
                <div class="meta-row">
                  <span class="pill" aria-hidden="true"></span>
                  <span id="mRole">Coloring / UI</span>
                </div>
                <div class="meta-row">
                  <span class="pill" aria-hidden="true"></span>
                  <span id="mLink1">mmmm::/mmmmmmmm</span>
                </div>
                <div class="meta-row">
                  <span class="pill" aria-hidden="true"></span>
                  <span id="mLink2">mmmm::/mmmmmmmm</span>
                </div>
              </div>

              <button
                class="modal-close"
                type="button"
                id="modalClose"
                aria-label="close"
              >
                ×
              </button>
            </div>
          </div>
          <div class="modal-divider"></div>
        </div>

        <div class="modal-body">
          <div class="viewer" aria-label="project image viewer">
            <button
              class="arrow left"
              type="button"
              id="prevBtn"
              aria-label="previous"
            ></button>
            <button
              class="arrow right"
              type="button"
              id="nextBtn"
              aria-label="next"
            ></button>
            <img id="viewerImg" src="" alt="project image" />
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentProjectIndex = 0;
      const cards = document.querySelectorAll(".card");

      const backdrop = document.getElementById("modalBackdrop");
      const closeBtn = document.getElementById("modalClose");

      const mKind = document.getElementById("mKind");
      const mTitle = document.getElementById("mTitle");
      const mPeriod = document.getElementById("mPeriod");
      const mRole = document.getElementById("mRole");
      const mLink1 = document.getElementById("mLink1");
      const mLink2 = document.getElementById("mLink2");

      const viewerImg = document.getElementById("viewerImg");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let images = [];
      let idx = 0;

      function openModal(card) {
        currentProjectIndex = [...cards].indexOf(card);
        // 텍스트 채우기
        mKind.textContent = card.dataset.kind || "";
        mTitle.textContent = card.dataset.title || "";
        mPeriod.textContent = card.dataset.period || "";
        mRole.textContent = card.dataset.role || "";
        mLink1.textContent = card.dataset.link1 || "";
        mLink2.textContent = card.dataset.link2 || "";

        // 이미지 목록
        images = (card.dataset.images || "")
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);
        idx = 0;
        viewerImg.src = images[idx] || "";
        viewerImg.alt = `${mTitle.textContent} image ${idx + 1}`;

        // 모달 열기
        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        backdrop.classList.remove("open");
        backdrop.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      function showImage(nextIndex) {
        if (!images.length) return;
        idx = (nextIndex + images.length) % images.length;
        viewerImg.src = images[idx];
        viewerImg.alt = `${mTitle.textContent} image ${idx + 1}`;
      }

      // 카드 클릭 → 모달
      cards.forEach((card, i) => {
        card.addEventListener("click", () => {
          currentProjectIndex = i;
          openModal(card);
        });
      });

      // 닫기
      closeBtn.addEventListener("click", closeModal);

      // 배경 클릭하면 닫기(모달 내부 클릭은 무시)
      backdrop.addEventListener("click", (e) => {
        if (e.target === backdrop) closeModal();
      });

      // ESC로 닫기
      window.addEventListener("keydown", (e) => {
        if (!backdrop.classList.contains("open")) return;

        switch (e.key) {
          case "Escape":
            closeModal();
            break;

          case "ArrowLeft":
            moveProject(-1);
            break;

          case "ArrowRight":
            moveProject(1);
            break;
        }
      });

      // 좌우 슬라이드
      prevBtn.addEventListener("click", () => moveProject(-1));
      nextBtn.addEventListener("click", () => moveProject(1));
      function moveProject(dir) {
        // dir: -1 (prev) / +1 (next)
        const total = cards.length;
        currentProjectIndex = (currentProjectIndex + dir + total) % total;
        openModal(cards[currentProjectIndex]);
      }
      // ===== 로딩 시 카드 둥실 등장(순차) =====
      window.addEventListener("load", () => {
        cards.forEach((card, i) => {
          setTimeout(() => {
            card.classList.add("is-visible");
          }, 120 * i); // 0ms, 120ms, 240ms, 360ms...
        });
      });
    </script>
  </body>
</html>
