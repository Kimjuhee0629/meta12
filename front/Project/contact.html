<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>

    <style>
      :root {
        --bg: #f4f4f4;
        --text: #1e1e1e;
        --muted: #9a9a9a;
        --line: rgba(0, 0, 0, 0.18);
        --panel: #ffffff;
        --shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR",
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      /* ====== Global container ====== */
      .wrap {
        width: min(1100px, calc(100% - 56px));
        margin: 0 auto;
      }

      /* ====== Top Nav (너가 쓰던 그대로) ====== */
      header.topnav {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(244, 244, 244, 0.9);
        backdrop-filter: blur(6px);
        padding: 18px 0;
      }
      .topnav nav {
        display: flex;
        justify-content: center;
        gap: 44px;
        font-size: 20px;
        letter-spacing: 0.2px;
        align-items: center;
      }
      .topnav a {
        color: #9a9a9a;
      }
      .topnav a.active {
        color: var(--text);
      }
      .topnav a:hover {
        color: #5a5a5a;
      }

      /* Gallery dropdown wrapper */
      .nav-item {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .dropdown {
        position: absolute;
        left: 50%;
        top: calc(100% + 10px);
        transform: translateX(-50%) translateY(-6px);
        min-width: 132px;

        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.14);
        border-radius: 8px;
        padding: 10px;

        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 160ms ease, transform 160ms ease,
          visibility 0ms linear 160ms;
        z-index: 60;
      }

      .dropdown a {
        display: block;
        padding: 7px 10px;
        font-size: 13px;
        color: #6a6a6a;
        border-radius: 8px;
        white-space: nowrap;
      }
      .dropdown a:hover,
      .dropdown a:focus-visible {
        background: rgba(0, 0, 0, 0.06);
        color: #222;
        outline: none;
      }

      .nav-item:hover .dropdown,
      .nav-item:focus-within .dropdown {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
        transition: opacity 160ms ease, transform 160ms ease, visibility 0ms;
      }

      .nav-item::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        height: 12px;
      }

      /* ====== CONTACT LAYOUT ====== */
      main.contact {
        min-height: calc(100vh - 72px);
        display: grid;
        place-items: center;
        padding: 70px 0 90px;
      }

      .contact-grid {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1.12fr;
        gap: 64px;
        align-items: center;
      }

      /* LEFT */
      .contact-left h1 {
        font-size: 92px;
        line-height: 0.92;
        letter-spacing: -1px;
        font-weight: 900;
      }

      .contact-left .sub {
        margin-top: 34px;
        color: #b0b0b0;
        font-size: 14px;
        line-height: 1.55;
        letter-spacing: 0.4px;

        /* 스샷처럼 점점점 느낌 */
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        opacity: 0.9;
      }

      .contact-left .dots {
        margin-top: 28px;
        display: flex;
        gap: 26px;
        align-items: center;
      }
      .contact-left .dot {
        width: 64px;
        height: 64px;
        border-radius: 999px;
        background: #cfcfcf;
      }

      /* RIGHT (FORM) */
      .contact-form {
        width: 100%;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 14px;
      }

      .field,
      .textarea {
        width: 100%;
        border: 1px solid rgba(0, 0, 0, 0.18);
        background: #fff;
        padding: 14px 14px;
        font-size: 16px;
        color: #222;
        outline: none;
        box-shadow: var(--shadow);
      }

      .field::placeholder,
      .textarea::placeholder {
        color: #8e8e8e;
      }

      .textarea {
        height: 320px;
        resize: none;
      }

      .form-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 18px;
      }

      .ok-btn {
        width: 170px;
        height: 52px;
        border: 0;
        cursor: pointer;
        background: #7a7a7a;
        color: #fff;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .ok-btn:hover {
        filter: brightness(0.95);
      }

      /* 접근성 */
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(0, 0, 0, 0.18);
        outline-offset: 4px;
      }

      /* Responsive */
      @media (max-width: 980px) {
        .wrap {
          width: calc(100% - 32px);
        }
        .contact-grid {
          grid-template-columns: 1fr;
          gap: 36px;
        }
        .contact-left h1 {
          font-size: 72px;
        }
        .textarea {
          height: 260px;
        }
        .form-actions {
          justify-content: flex-start;
        }
      }

      @media (max-width: 560px) {
        .field-row {
          grid-template-columns: 1fr;
        }
        .contact-left h1 {
          font-size: 58px;
        }
        .contact-left .dot {
          width: 54px;
          height: 54px;
        }
      }
      /* ====== Contact enter animation ====== */
@keyframes dropIn {
  from {
    opacity: 0;
    transform: translateY(-18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 전체 섹션이 한번에 떨어지며 등장 */
.contact-grid {
  opacity: 0;
  transform: translateY(-18px);
  animation: dropIn 900ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  animation-delay: 120ms;
}

/* 왼쪽/오른쪽 따로 순차로 등장 (원하면) */
.contact-left {
  opacity: 0;
  transform: translateY(-18px);
  animation: dropIn 1200ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  animation-delay: 120ms;
}
.contact-form {
  opacity: 0;
  transform: translateY(-18px);
  animation: dropIn 1200ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  animation-delay: 500ms;
}

/* 접근성: 모션 줄이기 설정이면 애니메이션 끔 */
@media (prefers-reduced-motion: reduce) {
  .contact-grid,
  .contact-left,
  .contact-form {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
}
    </style>
  </head>

  <body>
    <!-- NAV (너가 쓰던 그대로) -->
    <header class="topnav">
      <div class="wrap">
        <nav aria-label="Primary">
          <a href="Start.html"
            ><svg
              viewBox="0 0 1195 1195"
              width="20px"
              xmlns="http://www.w3.org/2000/svg"

              <path
                d="M1109.333 997.248c0 50.176-41.6 90.752-93.12 90.752H724.95V736.32c0-53.056-38.016-96.128-85.056-96.128h-85.12c-46.976 0-85.12 43.072-85.12 96.128V1088H178.39c-51.392 0-93.056-40.576-93.056-90.752V518.272c0-23.36 9.344-44.48 24.192-60.544l-.96-1.856L534.485 82.88c34.304-25.152 89.984-25.152 124.288 0l427.264 372.992-.448 2.368c14.592 16.064 23.744 36.928 23.744 60.032v478.976z"
              />
            </svg>
          </a>

          <a href="./main.html">Main</a>
          <a href="./Experience.html">Experience</a>

          <div class="nav-item">
            <a href="./gallery.html" aria-haspopup="true">Gallery</a>
            <div class="dropdown" role="menu" aria-label="Gallery categories">
  <a href="./gallery.html?cat=Game" role="menuitem">Game</a>
  <a href="./gallery.html?cat=Illust" role="menuitem">Illust</a>
  <a href="./gallery.html?cat=3D" role="menuitem">3D</a>
  <a href="./gallery.html?cat=Design" role="menuitem">Design</a>
</div>
          </div>

          <a class="active" href="./Contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <!-- CONTACT -->
    <main class="contact">
      <div class="wrap">
        <section class="contact-grid" aria-label="Contact section">
          <!-- LEFT -->
          <div class="contact-left">
            <h1>GET IN<br />TOUCH</h1>

            <div class="sub">
              1wnldpdlc@naver.com<br />
              HOOO//OOOOOOOOOOOOOO
            </div>

            <div class="dots" aria-hidden="true">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>

          <!-- RIGHT -->
          <form class="contact-form" action="#" method="post">
            <div class="field-row">
              <input class="field" type="text" name="firstName" placeholder="First Name" />
              <input class="field" type="text" name="lastName" placeholder="Last Name" />
            </div>

            <div class="field-row">
              <input class="field" type="email" name="email" placeholder="Emaill" />
              <input class="field" type="tel" name="phone" placeholder="Phone" />
            </div>

            <textarea class="textarea" name="message" placeholder="Tell us a secret..."></textarea>

            <div class="form-actions">
              <button class="ok-btn" type="submit">OK</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
